// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        mavenPublishUrl = 'https://mvnrepo.guance.com/repository'
        getDefaultProperties = this.&getDefaultProperties
        sdkVersions = [
                ftSdk                     : "1.7.5",
                ftSdkMiniReplaySupport    : "0.1.3",
                ftSessionReplay           : "0.1.8",
                replayMiniAgentSupport    : "1.7.0",
                ftPlugin                  : "1.3.8",
                ftPluginBuildscript       : "1.3.8-beta01",
                pluginMinAgentSupport     : "1.7.5",
                ftNative                  : "1.1.3"
        ]
    }

    Properties properties = new Properties()
    def localPropertiesPath = 'local.properties'
    if (project.rootProject.file(localPropertiesPath).exists()) {
        properties.load(project.rootProject.file(localPropertiesPath).newDataInputStream())
    }

    def getEnvironmentOrLocalProperty = { String name ->
        def environmentValue = System.getenv(name)
        return environmentValue != null ? environmentValue : properties.getProperty(name)
    }

    def appIdString = getEnvironmentOrLocalProperty("RUM_APP_ID")
    def datakitRUMUrl = getEnvironmentOrLocalProperty("DATAKIT_URL")
    def datawayRUMUrl = getEnvironmentOrLocalProperty("DATAWAY_URL")
    def clientToken = getEnvironmentOrLocalProperty("CLIENT_TOKEN")
    def datawayToken = getEnvironmentOrLocalProperty("DATAWAY_TOKEN")
    def trackId = getEnvironmentOrLocalProperty("TRACK_ID")
    def traceUrl = getEnvironmentOrLocalProperty("TRACE_URL")
    def proxyAddress = getEnvironmentOrLocalProperty("PROXY_ADDRESS")
    def webSocketTestSuccessUrl = getEnvironmentOrLocalProperty("FT_WEBSOCKET_TEST_SUCCESS_URL")
    def webSocketTestRejectUrl = getEnvironmentOrLocalProperty("FT_WEBSOCKET_TEST_REJECT_URL")
    def webSocketTestInvalidUpgradeUrl = getEnvironmentOrLocalProperty("FT_WEBSOCKET_TEST_INVALID_UPGRADE_URL")
    def webSocketTestTcpFailureUrl = getEnvironmentOrLocalProperty("FT_WEBSOCKET_TEST_TCP_FAILURE_URL")

    ext.ft_env = [
            'rumAppid'      : appIdString,
            'datakitRUMUrl' : datakitRUMUrl,
            'datawayRUMUrl' : datawayRUMUrl,
            'clientToken'   : clientToken,
            'datawayToken'  : datawayToken,
            'trackId'       : trackId,
            'traceUrl'      : traceUrl,
            'proxyAddress'  : proxyAddress,
            'webSocketTestSuccessUrl': webSocketTestSuccessUrl,
            'webSocketTestRejectUrl': webSocketTestRejectUrl,
            'webSocketTestInvalidUpgradeUrl': webSocketTestInvalidUpgradeUrl,
            'webSocketTestTcpFailureUrl': webSocketTestTcpFailureUrl,
            'prodTestEnv'   : 'gray',
            'prodPublishEnv': 'prod'
    ]
    repositories {
        google()
//        jcenter()
//        mavenLocal()
        maven {
            url "${mavenPublishUrl}/maven-releases"
        }
        maven {
            url "https://plugins.gradle.org/m2/"
        }

        flatDir dirs: "ft-plugin/build/libs"

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        if (Boolean.parseBoolean(getEnvironmentOrLocalProperty('FT_USE_LOCAL_PLUGIN'))) {
            classpath files("ft-plugin/build/libs/ft-plugin-${sdkVersions.ftPlugin}.jar")
        } else {
            classpath "com.cloudcare.ft.mobile.sdk.tracker.plugin:ft-plugin:${sdkVersions.ftPluginBuildscript}"
        }
//        classpath 'com.cloudcare.ft.mobile.sdk.tracker.plugin:ft-plugin-legacy:1.1.8'
//        classpath 'com.guardsquare:proguard-gradle:7.1.0'
//       classpath files('ft-plugin/build/libs/ft-plugin-1.3.7-alpha01.jar')

        classpath "com.github.gmazzo:gradle-buildconfig-plugin:3.1.0"
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven {
            url "${mavenPublishUrl}/maven-releases"
        }
        //
//        flatDir {
//            dirs 'libs'
//        }
    }
    configurations.all {
        resolutionStrategy {
            force("org.objenesis:objenesis:2.6")
        }
    }
}


def getDefaultProperties() {
    def userName = System.getProperty("LDAP_ACCOUNT")
    def password = System.getProperty("LDAP_PWD")

    Properties properties = new Properties()
    if (userName != null && password != null) {
        properties.setProperty("LDAP_ACCOUNT", userName)
        properties.setProperty("LDAP_PWD", password)
    } else {
        def file = project.rootProject.file('local.properties')
        if (file.exists()) {
            properties.load(file.newDataInputStream())
        }
    }
    return properties
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
